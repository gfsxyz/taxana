services:
  db:
    image: postgres:16-alpine
    container_name: taxana-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5434:5432"
    volumes:
      - taxana_pgdata:/var/lib/postgresql/data

volumes:
  taxana_pgdata:
